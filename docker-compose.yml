version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: echoscribe_postgres
    restart: always
    environment:
      POSTGRES_USER: echoscribe
      POSTGRES_PASSWORD: echoscribe_dev_pass
      POSTGRES_DB: echoscribe_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U echoscribe -d echoscribe_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: